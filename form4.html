        <h1>標識を作成する</h1>
        <p style="color:var(--ink-soft);font-size:.92rem;max-width:62ch">探偵業者は、公安委員会に届出をしたことを示す標識を営業所の見やすい場所に掲示しなければなりません（法第12条第2項）。常時使用する従業者が6人以上で自社ウェブサイトを持つ場合は、ウェブサイトへの掲載も必要です。</p>

<script>
(function(){
  var T = Tantei;
  var config = {
    id: "form4",
    exportName: "探偵業標識_入力データ.json",
    steps: [
      {
        id:"dest", title:"届出をした公安委員会",
        desc:"営業所の所在地の都道府県を選ぶと、公安委員会名が自動で入ります。",
        fields:[
          {id:"pref", type:"prefecture", label:"届出をした都道府県", required:true}
        ]
      },
      {
        id:"receipt", title:"届出書の受理番号・提出年月日",
        desc:"開始届出時に交付された受理番号を記載します。過去に変更届出をしたことがある場合も、開始届出時の番号を記載してください。",
        fields:[
          {id:"receiptNo", type:"text", label:"届出書の受理番号", required:true},
          {id:"submitDate", type:"eradate", label:"届出書を提出した年月日", required:true}
        ]
      },
      {
        id:"name", title:"商号・名称又は氏名",
        fields:[
          {id:"name", type:"text", label:"商号、名称又は氏名", required:true}
        ]
      },
      {
        id:"office", title:"営業所の情報",
        fields:[
          {id:"officeName", type:"text", label:"営業所の名称", required:true},
          {id:"officeAddress", type:"text", label:"営業所の所在地", required:true, help:"入居する建物の名称及び営業所の建物内の位置（階数・部屋番号等）も記載してください。"},
          {id:"officeType", type:"radio", label:"営業所の種別", required:true, options:[
            {value:"main", label:"主たる営業所"},
            {value:"other", label:"その他の営業所"}
          ]}
        ]
      },
      {
        id:"ad", title:"広告・宣伝に使用する名称",
        fields:[
          {id:"noAdName", type:"checkbox", label:"広告等の名称", checkboxLabel:"商号・営業所名と同じ名称しか使わないため「無し」とする"},
          {id:"adName", type:"text", label:"広告又は宣伝をする場合に使用する名称", showIf:function(s){return !s.noAdName;}}
        ]
      }
    ],
    renderDocument: function(s, T){
      var commission = s.pref ? T.publicSafetyCommissionName(s.pref) : "○○県公安委員会";
      var adName = s.noAdName ? "無し" : (s.adName || "");
      var officeTypeLabel = s.officeType==="main" ? "主たる営業所" : (s.officeType==="other" ? "その他の営業所" : "");
      return (
        "<div style='border:3px solid #000;padding:24px'>" +
        "<div class='doc-title' style='letter-spacing:.6em;margin-bottom:20px'>標　識</div>" +
        "<table class='doc-table'><tbody>" +
        "<tr><th>届出書を提出した公安委員会の名称</th><td>" + T.esc(commission) + "</td></tr>" +
        "<tr><th>届出書の受理番号</th><td>" + T.esc(s.receiptNo) + "</td></tr>" +
        "<tr><th>届出書を提出した年月日</th><td>" + T.esc(T.eraDateText(s.submitDate)) + "</td></tr>" +
        "<tr><th>商号、名称又は氏名</th><td>" + T.esc(s.name) + "</td></tr>" +
        "<tr><th>営業所の名称</th><td>" + T.esc(s.officeName) + "</td></tr>" +
        "<tr><th>営業所の所在地</th><td>" + T.esc(s.officeAddress) + "</td></tr>" +
        "<tr><th>営業所の種別</th><td>" + T.esc(officeTypeLabel) + "</td></tr>" +
        "<tr><th>広告又は宣伝をする場合に使用する名称</th><td>" + T.esc(adName) + "</td></tr>" +
        "</tbody></table>" +
        "</div>" +
        "<p class='doc-note'>用紙は日本産業規格Ａ４の白色無地とし、黒色の文字・枠線で作成してください（感熱紙は使用しないでください）。営業所の見やすい場所に掲示してください。従業者が6人以上で、かつ自社のウェブサイトを管理している場合は、このページの内容をウェブサイトにも掲載してください。</p>"
      );
    }
  };

  new TanteiWizard(config, document.getElementById("wizardMount"));
})();
</script>
</body>
</html>
