<script src="assets/wizard.js"></script>
<script src="assets/nav.js"></script>
<script>
(function(){
  var T = Tantei;
  var ENTITY_OPTIONS = [
    {value:"individual", label:"個人"},
    {value:"kk", label:"株式会社"},
    {value:"mochibun", label:"持分会社（合名・合資・合同会社）"},
    {value:"zaidan", label:"財団法人"},
    {value:"shadan", label:"社団法人"},
    {value:"other", label:"その他の法人"}
  ];
  var config = {
    id: "form2",
    exportName: "探偵業廃止届出書_入力データ.json",
    steps: [
      {
        id:"dest", title:"提出先・提出日",
        desc:"営業所の所在地の都道府県を選ぶと、あて先となる公安委員会名が自動で表示されます。",
        fields:[
          {id:"pref", type:"prefecture", label:"営業所の所在地（都道府県）", required:true},
          {id:"submitDate", type:"eradate", label:"届出年月日（提出する日）", required:true,
            help:"探偵業を廃止した日から10日以内に提出してください（廃止日を含まず、翌日から起算して10日以内）。"}
        ]
      },
      {
        id:"applicant", title:"届出者の情報",
        desc:"探偵業開始届出書に記載したときと同じ商号・名称又は氏名を入力してください。",
        fields:[
          {id:"furigana", type:"text", label:"商号、名称又は氏名（フリガナ）", required:true, help:"カタカナで入力してください。"},
          {id:"name", type:"text", label:"商号、名称又は氏名", required:true},
          {id:"entityType", type:"radio", label:"法人等の種別", required:true, options: ENTITY_OPTIONS},
          {id:"entityTypeOtherText", type:"text", label:"「その他の法人」の名称・種類", showIf:function(s){return s.entityType==="other";}}
        ]
      },
      {
        id:"original", title:"開始届出時の受理番号",
        desc:"探偵業を開始した際に提出した探偵業開始届出書について、公安委員会から通知された受理番号を入力します。標識や、当時の通知書類でご確認ください。",
        fields:[
          {id:"startReceiptNo", type:"text", label:"法第4条第1項の届出書の受理番号", required:true, help:"開始届出のときに交付された番号（標識に記載している番号）です。"}
        ]
      },
      {
        id:"abolish", title:"廃止の内容",
        desc:"実際に営業をやめた（やめる）年月日と、その具体的な事由を入力してください。",
        fields:[
          {id:"abolishDate", type:"eradate", label:"廃止の年月日", required:true},
          {id:"abolishReason", type:"textarea", label:"廃止の事由", required:true, placeholder:"例：一身上の都合により探偵業を廃業したため。\n例：他県に営業所を移転したため。\n例：事業縮小に伴い当該営業所を閉鎖したため。"}
        ]
      }
    ],
    renderDocument: function(s, T){
      var commission = s.pref ? T.publicSafetyCommissionName(s.pref) : "○○県公安委員会";
      var entityLabel = (ENTITY_OPTIONS.filter(function(o){return o.value===s.entityType;})[0]||{}).label || "";
      return (
        "<div class='doc-office'><table><tr><td>※ 資料区分</td><td style='width:60px'></td></tr>" +
        "<tr><td>※ 受理警察署</td><td>（　　　　　署）</td></tr>" +
        "<tr><td>※ 受理番号</td><td>※ 受理年月日　　　年　　月　　日</td></tr></table>" +
        "<div style='font-size:10px;color:#555'>（※印は警察において記入する欄です。記入不要です）</div></div>" +
        "<div class='doc-title'>探偵業廃止届出書</div>" +
        "<div class='doc-lawline'>探偵業の業務の適正化に関する法律第４条第２項の規定により届出をします。</div>" +
        "<div class='doc-date-line'>" + T.esc(T.eraDateText(s.submitDate) || "　　年　　月　　日") + "</div>" +
        "<div class='doc-to'>" + T.esc(commission) + "　殿</div>" +
        "<table class='doc-table'><tbody>" +
        "<tr><th>（フリガナ）</th><td class='furigana'>" + T.esc(s.furigana) + "</td></tr>" +
        "<tr><th>商号、名称又は氏名</th><td>" + T.esc(s.name) + "</td></tr>" +
        "<tr><th>法人等の種別</th><td>" + T.esc(entityLabel) + (s.entityType==="other" ? "（" + T.esc(s.entityTypeOtherText) + "）" : "") + "</td></tr>" +
        "<tr><th>法第4条第1項の届出書の受理番号</th><td>" + T.esc(s.startReceiptNo) + "</td></tr>" +
        "<tr><th>廃止の年月日</th><td>" + T.esc(T.eraDateText(s.abolishDate)) + "</td></tr>" +
        "<tr><th>廃止の事由</th><td>" + T.esc(s.abolishReason || "").replace(/\n/g,"<br>") + "</td></tr>" +
        "</tbody></table>" +
        "<p class='doc-note'>用紙は日本産業規格Ａ４（白色無地）を使用してください。</p>"
      );
    }
  };

  new TanteiWizard(config, document.getElementById("wizardMount"));
})();
</script>
</body>
