        <h1>探偵業開始届出書を作成する</h1>
        <p style="color:var(--ink-soft);font-size:.92rem;max-width:62ch">探偵業を開始しようとする日の前日までに、営業所の所在地を管轄する警察署を経由して、都道府県公安委員会に提出する届出書です。個人・法人のどちらにも対応しています。</p>

<script src="assets/common.js"></script>
<script src="assets/wizard.js"></script>
<script src="assets/nav.js"></script>
<script>
(function(){
  var T = Tantei;
  var ROLE_OPTIONS = [
    {value:"director", label:"取締役又は執行役"},
    {value:"auditor", label:"監査役"},
    {value:"exec_member", label:"業務を執行する社員"},
    {value:"riji", label:"理事"},
    {value:"kanji", label:"監事"},
    {value:"other", label:"その他"}
  ];
  var ENTITY_OPTIONS = [
    {value:"individual", label:"個人"},
    {value:"kk", label:"株式会社"},
    {value:"mochibun", label:"持分会社（合名・合資・合同会社）"},
    {value:"zaidan", label:"財団法人"},
    {value:"shadan", label:"社団法人"},
    {value:"other", label:"その他の法人"}
  ];

  function isIndividual(s){ return s.entityType === "individual"; }
  function isCorp(s){ return s.entityType && s.entityType !== "individual"; }

  var config = {
    id: "form1",
    exportName: "探偵業開始届出書_入力データ.json",
    steps: [
      {
        id:"dest", title:"提出先・提出日",
        desc:"営業所の所在地の都道府県を選ぶと、あて先となる公安委員会名が自動で表示されます。",
        fields:[
          {id:"pref", type:"prefecture", label:"営業所の所在地（都道府県）", required:true},
          {id:"submitDate", type:"eradate", label:"届出年月日（提出する日）", required:true,
            help:"この届出書を公安委員会あてに提出する年月日です。営業開始日の前日までに届出が必要です。"}
        ]
      },
      {
        id:"entity", title:"事業形態",
        desc:"個人で営むか、法人（会社等）で営むかを選んでください。",
        fields:[
          {id:"entityType", type:"radio", label:"法人等の種別", required:true, options: ENTITY_OPTIONS},
          {id:"entityTypeOtherText", type:"text", label:"「その他の法人」の名称・種類", showIf:function(s){return s.entityType==="other";}}
        ]
      },
      {
        id:"applicant", title:"届出者の情報",
        desc:"個人の場合はご自身の氏名・住所を、法人の場合は法人の商号・所在地を入力してください。",
        fields:[
          {id:"furigana", type:"text", label:"商号、名称又は氏名（フリガナ）", required:true, help:"カタカナで入力してください。"},
          {id:"name", type:"text", label:"商号、名称又は氏名", required:true},
          {id:"address", type:"text", label:"住所", required:true, help:"個人の場合はご自身の住所、法人の場合は本店（主たる事務所）の所在地を記載します。"},
          {id:"tel", type:"tel", label:"電話番号", required:true, placeholder:"000-0000-0000"},
          {id:"birthDate", type:"eradate", label:"生年月日（個人で届け出る場合のみ）", required:true, showIf:isIndividual}
        ]
      },
      {
        id:"rep", title:"代表者の情報（法人の場合）",
        desc:"法人として届け出る場合、代表者の情報を入力してください。個人で届け出る場合はこのステップの入力は不要です（そのまま「次へ」を押してください）。",
        fields:[
          {id:"repFurigana", type:"text", label:"代表者氏名（フリガナ）", required:true, showIf:isCorp},
          {id:"repName", type:"text", label:"代表者氏名", required:true, showIf:isCorp},
          {id:"repAddress", type:"text", label:"代表者住所", required:true, showIf:isCorp},
          {id:"repTel", type:"tel", label:"代表者電話番号", required:true, showIf:isCorp, placeholder:"000-0000-0000"},
          {id:"repBirth", type:"eradate", label:"代表者生年月日", required:true, showIf:isCorp}
        ]
      },
      {
        id:"officers", title:"役員一覧（法人の場合）",
        desc:"すべての役員について入力してください。個人で届け出る場合はこのステップの入力は不要です。",
        fields:[
          {id:"officers", type:"repeater", label:"役員", showIf:isCorp,
            addLabel:"＋ 役員を追加する",
            itemLabel:function(i){ return "役員 " + (i+1); },
            template:[
              {id:"furigana", type:"text", label:"氏名（フリガナ）"},
              {id:"name", type:"text", label:"氏名"},
              {id:"role", type:"select", label:"役職", options: ROLE_OPTIONS},
              {id:"address", type:"text", label:"住所"},
              {id:"tel", type:"text", label:"電話番号"},
              {id:"birth", type:"eradate", label:"生年月日"}
            ]
          }
        ]
      },
      {
        id:"office", title:"営業所の情報",
        desc:"個人で営業所が自宅を兼ねる場合も、その住所を記載します。営業所は複数設置できますが、その場合は営業所ごとに届出が必要です（このツールでは1営業所分を作成します）。",
        fields:[
          {id:"officeName", type:"text", label:"営業所の名称", required:false, help:"個人で営業所に名称がない場合は空欄のままで構いません。"},
          {id:"officeAddress", type:"text", label:"営業所の所在地", required:true, help:"入居する建物の名称・部屋番号（階数等）まで記載してください。"},
          {id:"officeTel", type:"tel", label:"営業所の電話番号", required:true, placeholder:"000-0000-0000"},
          {id:"officeSetDate", type:"eradate", label:"営業所の設置年月日", required:true},
          {id:"officeType", type:"radio", label:"営業所の種別", required:true, options:[
            {value:"main", label:"主たる営業所"},
            {value:"other", label:"その他の営業所"}
          ]}
        ]
      },
      {
        id:"ad", title:"広告・宣伝に使用する名称",
        desc:"商号・名称又は営業所の名称とは別に、広告や宣伝で使う名称がある場合に記載します。",
        fields:[
          {id:"noAdName", type:"checkbox", label:"広告等の名称", checkboxLabel:"商号・営業所名と同じ名称しか使わないため「無し」とする"},
          {id:"adName", type:"text", label:"広告又は宣伝をする場合に使用する名称", showIf:function(s){return !s.noAdName;}, help:"例：営業所名が「〇〇探偵事務所」で、広告では「〇〇リサーチ」という名称も使う場合、ここに「〇〇リサーチ」と記載します。"}
        ]
      }
    ],
    renderDocument: function(s, T){
      var commission = s.pref ? T.publicSafetyCommissionName(s.pref) : "○○県公安委員会";
      var entityLabel = (ENTITY_OPTIONS.filter(function(o){return o.value===s.entityType;})[0]||{}).label || "";
      var rows = "";
      rows += "<tr><th>（フリガナ）</th><td class='furigana'>" + T.esc(s.furigana) + "</td></tr>";
      rows += "<tr><th>商号、名称又は氏名</th><td>" + T.esc(s.name) + "</td></tr>";
      rows += "<tr><th>住所</th><td>" + T.esc(s.address) + "</td></tr>";
      rows += "<tr><th>電話番号</th><td>" + T.esc(s.tel) + "</td></tr>";
      rows += "<tr><th>法人等の種別</th><td>" + T.esc(entityLabel) + (s.entityType==="other" ? "（" + T.esc(s.entityTypeOtherText) + "）" : "") + "</td></tr>";
      if(isIndividual(s)){
        rows += "<tr><th>生年月日</th><td>" + T.esc(T.eraDateText(s.birthDate)) + "</td></tr>";
      }
      var repBlock = "";
      if(isCorp(s)){
        repBlock += "<div class='doc-sub-title'>別紙：代表者</div>";
        repBlock += "<table class='doc-table'><tbody>";
        repBlock += "<tr><th>（フリガナ）</th><td class='furigana'>" + T.esc(s.repFurigana) + "</td></tr>";
        repBlock += "<tr><th>氏名</th><td>" + T.esc(s.repName) + "</td></tr>";
        repBlock += "<tr><th>住所</th><td>" + T.esc(s.repAddress) + "</td></tr>";
        repBlock += "<tr><th>電話番号</th><td>" + T.esc(s.repTel) + "</td></tr>";
        repBlock += "<tr><th>生年月日</th><td>" + T.esc(T.eraDateText(s.repBirth)) + "</td></tr>";
        repBlock += "</tbody></table>";

        repBlock += "<div class='doc-sub-title'>別紙：役員</div>";
        repBlock += "<table class='doc-table'><thead><tr><th>役職</th><th>氏名（フリガナ）</th><th>住所</th><th>電話番号</th><th>生年月日</th></tr></thead><tbody>";
        (s.officers||[]).forEach(function(o){
          var roleLabel = (ROLE_OPTIONS.filter(function(r){return r.value===o.role;})[0]||{}).label || "";
          repBlock += "<tr><td>" + T.esc(roleLabel) + "</td><td>" + T.esc(o.name) + "<br><span class='furigana'>" + T.esc(o.furigana) + "</span></td><td>" + T.esc(o.address) + "</td><td>" + T.esc(o.tel) + "</td><td>" + T.esc(T.eraDateText(o.birth)) + "</td></tr>";
        });
        if(!(s.officers||[]).length){ repBlock += "<tr><td colspan='5'>（未登録）</td></tr>"; }
        repBlock += "</tbody></table>";
      }

      var adName = s.noAdName ? "無し" : (s.adName || "");

      return (
        "<div class='doc-office'><table><tr><td>※ 資料区分</td><td style='width:60px'></td></tr>" +
        "<tr><td>※ 受理警察署</td><td>（　　　　　署）</td></tr>" +
        "<tr><td>※ 受理番号</td><td>※ 受理年月日　　　年　　月　　日</td></tr></table>" +
        "<div style='font-size:10px;color:#555'>（※印は警察において記入する欄です。記入不要です）</div></div>" +
        "<div class='doc-title'>探偵業開始届出書</div>" +
        "<div class='doc-lawline'>探偵業の業務の適正化に関する法律第４条第１項の規定により届出をします。</div>" +
        "<div class='doc-date-line'>" + T.esc(T.eraDateText(s.submitDate) || "　　年　　月　　日") + "</div>" +
        "<div class='doc-to'>" + T.esc(commission) + "　殿</div>" +
        "<table class='doc-table'><tbody>" + rows + "</tbody></table>" +
        "<div class='doc-sub-title'>営業所</div>" +
        "<table class='doc-table'><tbody>" +
        "<tr><th>名称</th><td>" + T.esc(s.officeName) + "</td></tr>" +
        "<tr><th>所在地</th><td>" + T.esc(s.officeAddress) + "</td></tr>" +
        "<tr><th>電話番号</th><td>" + T.esc(s.officeTel) + "</td></tr>" +
        "<tr><th>設置年月日</th><td>" + T.esc(T.eraDateText(s.officeSetDate)) + "</td></tr>" +
        "<tr><th>種別</th><td>" + (s.officeType==="main" ? "主たる営業所" : (s.officeType==="other" ? "その他の営業所" : "")) + "</td></tr>" +
        "<tr><th>広告又は宣伝をする場合に使用する名称</th><td>" + T.esc(adName) + "</td></tr>" +
        "</tbody></table>" +
        repBlock +
        "<p class='doc-note'>用紙は日本産業規格Ａ４（白色無地）を使用してください。</p>"
      );
    }
  };

  new TanteiWizard(config, document.getElementById("wizardMount"));
})();
</script>
</body>
</html>
